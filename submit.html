<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitch a Story | The Anchor</title>
  <meta name="description" content="The Anchor is the student newspaper of Morse High School in Bath, Maine.">
  <meta name="theme-color" content="#1f4fbf">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&family=Playfair+Display:ital,wght@0,800;1,700;1,800&family=Abril+Fatface&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=18">
</head>
<body data-page="submit">
  <div id="site-header"></div>
  <main id="main">
    <div class="wrap">
      <div class="page-head">
        <span class="kicker">Get involved</span>
        <h1>Pitch a Story</h1>
        <p>Send us an idea for a story. You can also write it yourself if you want to.</p>
      </div>
      <section class="section" style="max-width:720px">
        <div class="box">
          <form id="pitch-form">
            <label class="field">What's the story?<textarea name="idea" required placeholder="Tell us what's happening, who's involved, and why people should care."></textarea></label>
            <label class="field">Section
              <select name="section">
                <option>News</option><option>Features</option><option>Sports</option>
                <option>Opinion</option><option>Clubs</option><option>Arts &amp; Music</option><option>Podcast topic</option>
              </select>
            </label>
            <div class="form-row">
              <label class="field">Your name <small>(optional)</small><input name="name" autocomplete="name"></label>
              <label class="field">Grade <small>(optional)</small>
                <select name="grade"><option value="">Select</option><option>9</option><option>10</option><option>11</option><option>12</option><option>Staff</option></select>
              </label>
            </div>
            <label class="field">How can we reach you? <small>(optional)</small><input name="contact" placeholder="School email"></label>
            <label class="field" style="font-weight:400"><input type="checkbox" name="write_it" value="yes" style="display:inline;width:auto;margin-right:8px">I'd like to write this story myself</label>
            <button class="btn" type="submit">Send pitch</button>
          </form>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="data.js?v=18"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
